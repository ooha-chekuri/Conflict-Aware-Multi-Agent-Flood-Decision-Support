[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conflict-aware-flood-support"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "pydantic>=2.7,<3", "fastapi>=0.111,<1", "uvicorn[standard]>=0.30,<1", "streamlit>=1.36,<2", "PyMuPDF>=1.24,<2", "python-dotenv>=1,<2", "openai>=1.70,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
